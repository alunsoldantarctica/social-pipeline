name: Sync from upstream

# Pulls the latest commits from alunsoldantarctica/social-pipeline into your
# fork's `main` branch. Runs daily and on demand. Only fast-forwards — if your
# fork has diverging edits to wrangler.toml / astro.config.mjs / etc., the run
# fails and you'll need to merge manually with: gh repo sync <you>/social-pipeline -b main
#
# Disable by deleting this file or commenting out the schedule.

on:
  schedule:
    - cron: '17 6 * * *' # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'alunsoldantarctica/social-pipeline'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main)
          echo "$response"
          merge_type=$(echo "$response" | jq -r '.merge_type // "unknown"')
          echo "merge_type=$merge_type" >> "$GITHUB_STEP_SUMMARY"
