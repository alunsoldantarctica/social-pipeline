name = "social-pipeline"
compatibility_date = "2025-01-01"
main = "@astrojs/cloudflare/entrypoints/server"
workers_dev = true
preview_urls = true

# KV Namespace for Astro Sessions
# Created automatically by the deploy workflow (deploy.yml).
# For local dev: wrangler kv namespace create SESSION --preview
[[kv_namespaces]]
binding = "SESSION"
id = ""

# R2 bucket for file uploads and media storage
# Created automatically by the deploy workflow (deploy.yml).
# Free tier: 10 GB storage, 1M Class A + 10M Class B ops/month
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "social-pipeline-uploads"
preview_bucket_name = "social-pipeline-uploads-preview"

# Environment variables
[vars]
# Production canonical site URL — also used as the GitHub OAuth callback base
SITE_URL = "https://your-domain.com"
# Your Convex deployment URL (from Convex dashboard → Settings)
PUBLIC_CONVEX_URL = "https://your-deployment.convex.cloud"
# VAPID public key for web push (generate with: npx web-push generate-vapid-keys)
PUBLIC_VAPID_KEY = "REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY"
# Cloudflare Images account hash (Cloudflare Dashboard → Images → Overview)
CLOUDFLARE_IMAGES_HASH = "REPLACE_WITH_YOUR_IMAGES_HASH"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# ===== Dev Environment =====
[env.dev]
name = "social-pipeline-dev"
workers_dev = true

[env.dev.vars]
SITE_URL = "http://localhost:4321"
PUBLIC_CONVEX_URL = "https://your-dev-deployment.convex.cloud"
PUBLIC_VAPID_KEY = "REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY"
CLOUDFLARE_IMAGES_HASH = "REPLACE_WITH_YOUR_IMAGES_HASH"

[[env.dev.kv_namespaces]]
binding = "SESSION"
id = ""

[[env.dev.r2_buckets]]
binding = "UPLOADS"
bucket_name = "social-pipeline-uploads-preview"
preview_bucket_name = "social-pipeline-uploads-preview"

[env.dev.observability]
enabled = true
head_sampling_rate = 1

[env.dev.observability.logs]
enabled = true
invocation_logs = true
